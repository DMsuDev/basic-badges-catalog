name: Markdown Lint

on:
  push:
    branches: [master]
    paths:
      - "**.md"
  pull_request:
    branches: [master]
    paths:
      - "**.md"
  workflow_dispatch:

jobs:
  lint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
